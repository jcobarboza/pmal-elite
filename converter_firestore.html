<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PMAL Elite — Firestore Importador</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.firebaseModules = {
  initializeApp,
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
};
</script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:white;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
}
h1{
  color:#60a5fa;
}
button{
  background:#2563eb;
  color:white;
  border:none;
  padding:14px 18px;
  border-radius:14px;
  font-weight:bold;
  cursor:pointer;
}
input, textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #334155;
  background:#020617;
  color:white;
}
.log{
  background:black;
  padding:16px;
  border-radius:16px;
  white-space:pre-wrap;
  max-height:300px;
  overflow:auto;
}
.success{
  color:#22c55e;
}
.error{
  color:#ef4444;
}
.info{
  color:#93c5fd;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h1>🛡️ PMAL Elite — Importador Firestore</h1>

<p>
Esta versão envia as questões diretamente para o Firestore.
</p>

<p><strong>Passo 1:</strong> Cole sua configuração Firebase.</p>

<textarea id="firebaseConfig" rows="12">
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "SEU_AUTH_DOMAIN",
  projectId: "SEU_PROJECT_ID",
  storageBucket: "SEU_BUCKET",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};
</textarea>

<p><strong>Passo 2:</strong> Selecione a planilha.</p>

<input type="file" id="fileInput" accept=".xlsx,.xls"/>

<br><br>

<button onclick="startImport()">Importar para Firestore</button>
</div>

<div class="card">
<h2>Status</h2>
<div class="log" id="log">Aguardando importação...</div>
</div>

</div>

<script>
function log(msg, type="info"){
  const el = document.getElementById("log");
  const span = document.createElement("div");
  span.className = type;
  span.textContent = msg;
  el.appendChild(span);
}

function clearLog(){
  document.getElementById("log").innerHTML = "";
}

async function startImport(){

  clearLog();

  try{

    const configText = document.getElementById("firebaseConfig").value;

    const match = configText.match(/\{[\s\S]*\}/);

    if(!match){
      log("Configuração Firebase inválida.", "error");
      return;
    }

    const firebaseConfig = eval("(" + match[0] + ")");

    const {
      initializeApp,
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } = window.firebaseModules;

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    log("Firebase conectado.", "success");

    const fileInput = document.getElementById("fileInput");

    if(!fileInput.files.length){
      log("Selecione uma planilha.", "error");
      return;
    }

    const file = fileInput.files[0];

    log("Lendo planilha...", "info");

    const data = await file.arrayBuffer();

    const workbook = XLSX.read(data, {type:"array"});

    if(!workbook.SheetNames.includes("BANCO_MASTER")){
      log("Aba BANCO_MASTER não encontrada.", "error");
      return;
    }

    const sheet = workbook.Sheets["BANCO_MASTER"];

    const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});

    log(`${rows.length} linhas encontradas.`, "info");

    let successCount = 0;
    let failCount = 0;

    for(const raw of rows){

      if(!raw.id || !raw.statement){
        continue;
      }

      const question = {
        id: String(raw.id).trim(),
        cargo: String(raw.cargo || "")
          .split(",")
          .map(v => v.trim())
          .filter(Boolean),

        area: String(raw.area || "").trim(),
        topic: String(raw.topic || "").trim(),
        subtopic: String(raw.subtopic || "").trim(),
        difficulty: String(raw.difficulty || "Média").trim(),
        style: String(raw.style || "Cebraspe").trim(),
        statement: String(raw.statement || "").trim(),
        answer: String(raw.answer || "").trim(),
        explanation: String(raw.explanation || "").trim(),
        legalBasis: String(raw.legalBasis || "").trim(),
        tags: String(raw.tags || "")
          .split(",")
          .map(v => v.trim())
          .filter(Boolean),

        weight: Number(raw.weight || 1),

        createdAt: serverTimestamp()
      };

      try{

        await addDoc(collection(db, "questions"), question);

        successCount++;

        log(`✔ ${question.id} enviada`, "success");

      }catch(err){

        failCount++;

        log(`✖ Erro em ${question.id}: ${err.message}`, "error");
      }
    }

    log("--------------------------------", "info");
    log(`Importação concluída.`, "success");
    log(`Sucesso: ${successCount}`, "success");
    log(`Falhas: ${failCount}`, failCount ? "error" : "info");

  }catch(err){

    log(err.message, "error");
  }
}
</script>
</body>
</html>
