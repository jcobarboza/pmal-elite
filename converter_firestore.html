<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PMAL Elite — Importador Firestore PRO</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDocs,
  query,
  where,
  writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.firebaseModules = {
  initializeApp,
  getFirestore,
  collection,
  doc,
  setDoc,
  getDocs,
  query,
  where,
  writeBatch,
  serverTimestamp
};
</script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:white;
}
.container{
  max-width:980px;
  margin:auto;
  padding:20px;
}
.card{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:22px;
  padding:24px;
  margin-bottom:20px;
}
h1{
  color:#60a5fa;
  margin-top:0;
}
button{
  background:#2563eb;
  color:white;
  border:none;
  padding:14px 18px;
  border-radius:14px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
input, textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #334155;
  background:#020617;
  color:white;
}
.log{
  background:black;
  padding:16px;
  border-radius:16px;
  white-space:pre-wrap;
  max-height:360px;
  overflow:auto;
  line-height:1.45;
}
.success{color:#22c55e}
.error{color:#ef4444}
.info{color:#93c5fd}
.warn{color:#fbbf24}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.stat{
  background:#020617;
  border:1px solid #334155;
  border-radius:18px;
  padding:14px;
  text-align:center;
}
.stat small{
  display:block;
  color:#93c5fd;
  font-size:11px;
  text-transform:uppercase;
  font-weight:bold;
}
.stat b{
  font-size:24px;
}
.progress-wrap{
  width:100%;
  height:18px;
  background:#020617;
  border:1px solid #334155;
  border-radius:999px;
  overflow:hidden;
  margin-top:14px;
}
.progress{
  height:100%;
  width:0%;
  background:#22c55e;
  transition:.2s;
}
.option{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
  background:#020617;
  border:1px solid #334155;
  border-radius:14px;
  padding:12px;
}
.option input{
  width:auto;
  margin:0;
}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h1>🛡️ PMAL Elite — Importador Firestore PRO</h1>

<p>
Importador otimizado com <strong>gravação em lote</strong>, validação prévia, ID fixo por questão e prevenção de duplicidade.
</p>

<p><strong>Passo 1:</strong> Cole sua configuração Firebase.</p>

<textarea id="firebaseConfig" rows="10">
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "SEU_AUTH_DOMAIN",
  projectId: "SEU_PROJECT_ID",
  storageBucket: "SEU_BUCKET",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};
</textarea>

<p><strong>Passo 2:</strong> Selecione a planilha.</p>

<input type="file" id="fileInput" accept=".xlsx,.xls"/>

<div class="option">
  <input type="checkbox" id="overwrite" checked />
  <label for="overwrite">
    Atualizar questões existentes com o mesmo ID.
    <br><small>Recomendado: evita duplicar questões já importadas.</small>
  </label>
</div>

<br>

<button id="importBtn" onclick="startImport()">Importar para Firestore</button>

<div class="progress-wrap">
  <div class="progress" id="progressBar"></div>
</div>
</div>

<div class="grid">
  <div class="stat"><small>Lidas</small><b id="readCount">0</b></div>
  <div class="stat"><small>Válidas</small><b id="validCount">0</b></div>
  <div class="stat"><small>Importadas</small><b id="importedCount">0</b></div>
  <div class="stat"><small>Erros</small><b id="errorCount">0</b></div>
</div>

<br>

<div class="card">
<h2>Status</h2>
<div class="log" id="log">Aguardando importação...</div>
</div>

</div>

<script>
function log(msg, type="info"){
  const el = document.getElementById("log");
  const line = document.createElement("div");
  line.className = type;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function clearLog(){
  document.getElementById("log").innerHTML = "";
}

function setText(id, value){
  document.getElementById(id).textContent = value;
}

function setProgress(done, total){
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
}

function normalizeText(v){
  return String(v ?? "").trim();
}

function parseCargo(value){
  const raw = normalizeText(value);
  if(!raw) return [];

  return raw
    .split(/[,;|]/)
    .map(v => v.trim())
    .filter(Boolean)
    .map(v => {
      const lower = v.toLowerCase();
      if(lower.includes("soldado")) return "Soldado";
      if(lower.includes("oficial")) return "Oficial";
      return v;
    });
}

function parseTags(value){
  const raw = normalizeText(value);
  if(!raw) return [];
  return raw.split(/[,;|]/).map(v => v.trim()).filter(Boolean);
}

function normalizeAnswer(value){
  const v = normalizeText(value).toLowerCase();
  if(["c","certo","correto"].includes(v)) return "Certo";
  if(["e","errado","incorreto"].includes(v)) return "Errado";
  return normalizeText(value);
}

function safeDocId(id){
  return normalizeText(id)
    .replace(/[\/\\#\?\[\]]/g, "-")
    .replace(/\s+/g, "-");
}

function validateQuestion(q, rowNumber){
  const errors = [];

  if(!q.id) errors.push("sem ID");
  if(!q.cargo.length) errors.push("sem cargo");
  if(!q.area) errors.push("sem área");
  if(!q.topic) errors.push("sem assunto");
  if(!q.statement) errors.push("sem enunciado");
  if(!["Certo","Errado"].includes(q.answer)) errors.push("resposta inválida");
  if(!q.explanation) errors.push("sem explicação");
  if(!q.legalBasis) errors.push("sem fundamento");

  return errors.map(e => `Linha ${rowNumber}: ${e}`);
}

function rowToQuestion(raw){
  return {
    id: normalizeText(raw.id),
    cargo: parseCargo(raw.cargo),
    area: normalizeText(raw.area),
    topic: normalizeText(raw.topic),
    subtopic: normalizeText(raw.subtopic),
    difficulty: normalizeText(raw.difficulty || "Média"),
    style: normalizeText(raw.style || "Cebraspe"),
    statement: normalizeText(raw.statement),
    answer: normalizeAnswer(raw.answer),
    explanation: normalizeText(raw.explanation),
    legalBasis: normalizeText(raw.legalBasis),
    tags: parseTags(raw.tags),
    weight: Number(raw.weight || 1),
    updatedAtText: new Date().toISOString()
  };
}

function chunkArray(arr, size){
  const chunks = [];
  for(let i=0; i<arr.length; i+=size){
    chunks.push(arr.slice(i, i+size));
  }
  return chunks;
}

async function startImport(){
  clearLog();
  setProgress(0, 1);
  setText("readCount", "0");
  setText("validCount", "0");
  setText("importedCount", "0");
  setText("errorCount", "0");

  const btn = document.getElementById("importBtn");
  btn.disabled = true;

  try{
    const configText = document.getElementById("firebaseConfig").value;
    const match = configText.match(/\{[\s\S]*\}/);

    if(!match){
      log("Configuração Firebase inválida.", "error");
      return;
    }

    const firebaseConfig = eval("(" + match[0] + ")");

    const {
      initializeApp,
      getFirestore,
      doc,
      writeBatch,
      serverTimestamp
    } = window.firebaseModules;

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    log("Firebase conectado.", "success");

    const fileInput = document.getElementById("fileInput");

    if(!fileInput.files.length){
      log("Selecione uma planilha.", "error");
      return;
    }

    const file = fileInput.files[0];
    log("Lendo planilha...", "info");

    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, {type:"array"});

    if(!workbook.SheetNames.includes("BANCO_MASTER")){
      log("Aba BANCO_MASTER não encontrada.", "error");
      return;
    }

    const sheet = workbook.Sheets["BANCO_MASTER"];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});

    setText("readCount", rows.length);
    log(`${rows.length} linhas encontradas.`, "info");

    let validQuestions = [];
    let errors = [];
    const localIds = new Set();

    rows.forEach((raw, index) => {
      const rowNumber = index + 2;
      const q = rowToQuestion(raw);

      if(!q.id && !q.statement) return;

      let rowErrors = validateQuestion(q, rowNumber);

      if(q.id && localIds.has(q.id)){
        rowErrors.push(`Linha ${rowNumber}: ID duplicado na própria planilha (${q.id})`);
      }

      if(rowErrors.length){
        errors.push(...rowErrors);
      } else {
        localIds.add(q.id);
        validQuestions.push(q);
      }
    });

    setText("validCount", validQuestions.length);
    setText("errorCount", errors.length);

    if(errors.length){
      log("Foram encontrados erros de validação. Corrija antes de importar.", "error");
      errors.slice(0, 80).forEach(e => log(e, "error"));
      if(errors.length > 80){
        log(`Mais ${errors.length - 80} erros ocultados.`, "warn");
      }
      return;
    }

    if(!validQuestions.length){
      log("Nenhuma questão válida encontrada.", "error");
      return;
    }

    log("Validação concluída sem erros.", "success");
    log("Iniciando importação em lotes...", "info");

    const chunks = chunkArray(validQuestions, 400);
    let imported = 0;

    for(let i = 0; i < chunks.length; i++){
      const batch = writeBatch(db);

      chunks[i].forEach(q => {
        const ref = doc(db, "questions", safeDocId(q.id));
        batch.set(ref, {
          ...q,
          updatedAt: serverTimestamp()
        }, { merge: true });
      });

      await batch.commit();

      imported += chunks[i].length;
      setText("importedCount", imported);
      setProgress(imported, validQuestions.length);

      log(`Lote ${i + 1}/${chunks.length} importado: ${chunks[i].length} questões.`, "success");

      await new Promise(resolve => setTimeout(resolve, 250));
    }

    log("--------------------------------", "info");
    log("Importação concluída com sucesso.", "success");
    log(`Total importado/atualizado: ${imported}`, "success");
    log("Agora abra o simulador e pressione CTRL + SHIFT + R.", "info");

  }catch(err){
    console.error(err);
    log(err.message, "error");
  }finally{
    btn.disabled = false;
  }
}
</script>
</body>
</html>
