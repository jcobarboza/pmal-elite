<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PMAL Elite — Importador Firestore ULTRA</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.firebaseModules = {
  initializeApp,
  getApps,
  getFirestore,
  doc,
  writeBatch,
  serverTimestamp
};
</script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#020617;color:white}
.container{max-width:980px;margin:auto;padding:20px}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:22px;padding:24px;margin-bottom:20px}
h1{color:#60a5fa;margin-top:0}
button{background:#2563eb;color:white;border:none;padding:14px 18px;border-radius:14px;font-weight:bold;cursor:pointer}
button.danger{background:#dc2626}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea{width:100%;padding:12px;margin-top:10px;border-radius:12px;border:1px solid #334155;background:#020617;color:white}
.log{background:black;padding:16px;border-radius:16px;white-space:pre-wrap;max-height:360px;overflow:auto;line-height:1.45}
.success{color:#22c55e}.error{color:#ef4444}.info{color:#93c5fd}.warn{color:#fbbf24}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#020617;border:1px solid #334155;border-radius:18px;padding:14px;text-align:center}
.stat small{display:block;color:#93c5fd;font-size:11px;text-transform:uppercase;font-weight:bold}
.stat b{font-size:24px}
.progress-wrap{width:100%;height:18px;background:#020617;border:1px solid #334155;border-radius:999px;overflow:hidden;margin-top:14px}
.progress{height:100%;width:0%;background:#22c55e;transition:.2s}
.option{display:flex;align-items:center;gap:10px;margin-top:12px;background:#020617;border:1px solid #334155;border-radius:14px;padding:12px}
.option input{width:auto;margin:0}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h1>🛡️ PMAL Elite — Importador Firestore ULTRA</h1>

<p>Versão estável com lote pequeno, logs detalhados, retry simples e documento com ID fixo.</p>

<p><strong>Passo 1:</strong> Cole sua configuração Firebase.</p>

<textarea id="firebaseConfig" rows="10">
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "SEU_AUTH_DOMAIN",
  projectId: "SEU_PROJECT_ID",
  storageBucket: "SEU_BUCKET",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};
</textarea>

<p><strong>Passo 2:</strong> Selecione a planilha.</p>
<input type="file" id="fileInput" accept=".xlsx,.xls"/>

<div class="option">
  <input type="checkbox" id="overwrite" checked />
  <label for="overwrite">Atualizar questões existentes com o mesmo ID.</label>
</div>

<br>
<button id="importBtn" onclick="startImport()">Importar para Firestore</button>
<button id="stopBtn" class="danger" onclick="stopImport()" disabled>Parar</button>

<div class="progress-wrap"><div class="progress" id="progressBar"></div></div>
</div>

<div class="grid">
  <div class="stat"><small>Lidas</small><b id="readCount">0</b></div>
  <div class="stat"><small>Válidas</small><b id="validCount">0</b></div>
  <div class="stat"><small>Importadas</small><b id="importedCount">0</b></div>
  <div class="stat"><small>Erros</small><b id="errorCount">0</b></div>
</div>

<br>

<div class="card">
<h2>Status</h2>
<div class="log" id="log">Aguardando importação...</div>
</div>

</div>

<script>
let shouldStop = false;

function log(msg,type="info"){
  const el=document.getElementById("log");
  const line=document.createElement("div");
  line.className=type;
  line.textContent=msg;
  el.appendChild(line);
  el.scrollTop=el.scrollHeight;
}
function clearLog(){document.getElementById("log").innerHTML=""}
function setText(id,v){document.getElementById(id).textContent=v}
function setProgress(done,total){
  const pct=total?Math.round((done/total)*100):0;
  document.getElementById("progressBar").style.width=pct+"%";
}
function stopImport(){
  shouldStop=true;
  log("Pedido de parada recebido. A importação será interrompida ao final do lote atual.","warn");
}

function normalizeText(v){return String(v??"").trim()}
function parseCargo(value){
  const raw=normalizeText(value);
  if(!raw)return [];
  return raw.split(/[,;|]/).map(v=>v.trim()).filter(Boolean).map(v=>{
    const l=v.toLowerCase();
    if(l.includes("soldado"))return "Soldado";
    if(l.includes("oficial"))return "Oficial";
    return v;
  });
}
function parseTags(value){
  const raw=normalizeText(value);
  if(!raw)return [];
  return raw.split(/[,;|]/).map(v=>v.trim()).filter(Boolean);
}
function normalizeAnswer(value){
  const v=normalizeText(value).toLowerCase();
  if(["c","certo","correto"].includes(v))return "Certo";
  if(["e","errado","incorreto"].includes(v))return "Errado";
  return normalizeText(value);
}
function safeDocId(id){
  return normalizeText(id).replace(/[\/\\#\?\[\]]/g,"-").replace(/\s+/g,"-");
}
function rowToQuestion(raw){
  return {
    id: normalizeText(raw.id),
    cargo: parseCargo(raw.cargo),
    area: normalizeText(raw.area),
    topic: normalizeText(raw.topic),
    subtopic: normalizeText(raw.subtopic),
    difficulty: normalizeText(raw.difficulty || "Média"),
    style: normalizeText(raw.style || "Cebraspe"),
    statement: normalizeText(raw.statement),
    answer: normalizeAnswer(raw.answer),
    explanation: normalizeText(raw.explanation),
    legalBasis: normalizeText(raw.legalBasis),
    tags: parseTags(raw.tags),
    weight: Number(raw.weight || 1),
    updatedAtText: new Date().toISOString()
  };
}
function validateQuestion(q,rowNumber){
  const errors=[];
  if(!q.id)errors.push("sem ID");
  if(!q.cargo.length)errors.push("sem cargo");
  if(!q.area)errors.push("sem área");
  if(!q.topic)errors.push("sem assunto");
  if(!q.statement)errors.push("sem enunciado");
  if(!["Certo","Errado"].includes(q.answer))errors.push("resposta inválida");
  if(!q.explanation)errors.push("sem explicação");
  if(!q.legalBasis)errors.push("sem fundamento");
  return errors.map(e=>`Linha ${rowNumber}: ${e}`);
}
function chunkArray(arr,size){
  const chunks=[];
  for(let i=0;i<arr.length;i+=size)chunks.push(arr.slice(i,i+size));
  return chunks;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function startImport(){
  shouldStop=false;
  clearLog();
  setProgress(0,1);
  setText("readCount","0");setText("validCount","0");setText("importedCount","0");setText("errorCount","0");
  document.getElementById("importBtn").disabled=true;
  document.getElementById("stopBtn").disabled=false;

  try{
    const configText=document.getElementById("firebaseConfig").value;
    const match=configText.match(/\{[\s\S]*\}/);
    if(!match){log("Configuração Firebase inválida.","error");return}
    const firebaseConfig=eval("(" + match[0] + ")");

    const {initializeApp,getApps,getFirestore,doc,writeBatch,serverTimestamp}=window.firebaseModules;
    const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig);
    const db=getFirestore(app);
    log("Firebase conectado.","success");

    const fileInput=document.getElementById("fileInput");
    if(!fileInput.files.length){log("Selecione uma planilha.","error");return}

    const data=await fileInput.files[0].arrayBuffer();
    const workbook=XLSX.read(data,{type:"array"});
    if(!workbook.SheetNames.includes("BANCO_MASTER")){log("Aba BANCO_MASTER não encontrada.","error");return}

    const rows=XLSX.utils.sheet_to_json(workbook.Sheets["BANCO_MASTER"],{defval:""});
    setText("readCount",rows.length);
    log(`${rows.length} linhas encontradas.`,"info");

    const validQuestions=[];
    const errors=[];
    const localIds=new Set();

    rows.forEach((raw,index)=>{
      const rowNumber=index+2;
      const q=rowToQuestion(raw);
      if(!q.id&&!q.statement)return;
      let rowErrors=validateQuestion(q,rowNumber);
      if(q.id&&localIds.has(q.id))rowErrors.push(`Linha ${rowNumber}: ID duplicado na planilha (${q.id})`);
      if(rowErrors.length)errors.push(...rowErrors);
      else{localIds.add(q.id);validQuestions.push(q)}
    });

    setText("validCount",validQuestions.length);
    setText("errorCount",errors.length);

    if(errors.length){
      log("Foram encontrados erros de validação. Corrija antes de importar.","error");
      errors.slice(0,120).forEach(e=>log(e,"error"));
      if(errors.length>120)log(`Mais ${errors.length-120} erros ocultados.`,"warn");
      return;
    }

    if(!validQuestions.length){log("Nenhuma questão válida encontrada.","error");return}

    log("Validação concluída sem erros.","success");
    log("Iniciando importação em lotes de 25 questões...","info");

    const chunks=chunkArray(validQuestions,25);
    let imported=0;

    for(let i=0;i<chunks.length;i++){
      if(shouldStop){log("Importação interrompida pelo usuário.","warn");break}

      log(`Preparando lote ${i+1}/${chunks.length}...`,"info");
      const batch=writeBatch(db);

      chunks[i].forEach(q=>{
        const ref=doc(db,"questions",safeDocId(q.id));
        batch.set(ref,{...q,updatedAt:serverTimestamp()},{merge:true});
      });

      let attempts=0;
      let committed=false;

      while(!committed && attempts<3){
        attempts++;
        try{
          log(`Enviando lote ${i+1}/${chunks.length}, tentativa ${attempts}...`,"info");
          await batch.commit();
          committed=true;
        }catch(err){
          log(`Falha no lote ${i+1}, tentativa ${attempts}: ${err.message}`,"error");
          if(attempts<3)await sleep(1500);
          else throw err;
        }
      }

      imported+=chunks[i].length;
      setText("importedCount",imported);
      setProgress(imported,validQuestions.length);
      log(`✔ Lote ${i+1}/${chunks.length} importado: ${chunks[i].length} questões.`,"success");
      await sleep(350);
    }

    log("--------------------------------","info");
    log(`Importação finalizada. Total importado/atualizado: ${imported}`,"success");
    log("Agora abra o simulador e pressione CTRL + SHIFT + R.","info");

  }catch(err){
    console.error(err);
    log("ERRO FINAL: "+err.message,"error");
    log("Se o erro for permission-denied, revise as regras do Firestore.","warn");
  }finally{
    document.getElementById("importBtn").disabled=false;
    document.getElementById("stopBtn").disabled=true;
  }
}
</script>
</body>
</html>
