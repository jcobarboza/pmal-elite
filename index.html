<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMAL Elite</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(circle at top, #172554, #020617 55%);
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 90px;
}

.app {
  max-width: 720px;
  margin: auto;
}

.header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}

.logo {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: rgba(37, 99, 235, .2);
  border: 1px solid rgba(96, 165, 250, .4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

h1 {
  margin: 0;
  color: #60a5fa;
  font-size: 28px;
}

.subtitle {
  margin: 4px 0 0;
  color: #94a3b8;
  font-size: 14px;
}

.card {
  background: rgba(15, 23, 42, .92);
  border: 1px solid #1e293b;
  border-radius: 26px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.pill {
  background: #0b1220;
  border: 1px solid #334155;
  color: #cbd5e1;
  padding: 7px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: bold;
}

.blue { color: #bfdbfe; border-color: rgba(96,165,250,.45); background: rgba(37,99,235,.15); }
.green { color: #bbf7d0; border-color: rgba(34,197,94,.45); background: rgba(34,197,94,.13); }
.red { color: #fecaca; border-color: rgba(239,68,68,.45); background: rgba(239,68,68,.13); }
.amber { color: #fde68a; border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.13); }

.statement {
  font-size: 21px;
  line-height: 1.5;
  font-weight: bold;
  font-style: italic;
  border-left: 4px solid #2563eb;
  padding-left: 16px;
  margin: 22px 0;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

button {
  border: 0;
  border-radius: 20px;
  padding: 17px;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button.secondary {
  background: #0b1220;
  border: 1px solid #334155;
  color: #cbd5e1;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.choice {
  background: #020617;
  border: 2px solid #334155;
}

.choice.correct { border-color: #22c55e; background: rgba(34,197,94,.18); color: #bbf7d0; }
.choice.wrong { border-color: #ef4444; background: rgba(239,68,68,.18); color: #fecaca; }
.choice.blank { border-color: #f59e0b; background: rgba(245,158,11,.15); color: #fde68a; }

.explanation {
  display: none;
  margin-top: 18px;
  padding: 16px;
  background: rgba(37,99,235,.13);
  border: 1px solid rgba(96,165,250,.35);
  border-radius: 20px;
  line-height: 1.5;
  color: #dbeafe;
}

.law {
  margin-top: 12px;
  padding: 14px;
  background: rgba(245,158,11,.14);
  border: 1px solid rgba(245,158,11,.35);
  border-radius: 18px;
  color: #fde68a;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.stat {
  background: #0b1220;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 12px;
  text-align: center;
}

.stat small {
  display: block;
  color: #94a3b8;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
}

.stat b {
  display: block;
  font-size: 24px;
  margin-top: 4px;
}

.error-item {
  background: #0b1220;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 14px;
  margin-top: 10px;
  line-height: 1.45;
}

.tabs {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  max-width: 720px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.tab {
  background: #0b1220;
  border: 1px solid #334155;
  color: #cbd5e1;
  font-size: 12px;
  padding: 12px 6px;
}

.tab.active {
  background: #2563eb;
  color: white;
}

.hidden { display: none; }

@media (min-width: 600px) {
  .buttons { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div class="logo">🛡️</div>
    <div>
      <h1>PMAL Elite</h1>
      <p class="subtitle">Simulado Cebraspe • Firebase • Caderno de Erros</p>
    </div>
  </div>

  <section id="screen-simulado">
    <div class="card">
      <div class="row">
        <span class="pill blue" id="status">Conectando...</span>
        <span class="pill amber" id="counter">0/0</span>
      </div>

      <p class="pill green" id="meta" style="margin-top:16px;">PMAL • Soldado e Oficial</p>

      <div id="topic" style="margin-top:16px;color:#93c5fd;font-weight:bold;text-transform:uppercase;font-size:12px;letter-spacing:.15em;"></div>

      <div class="statement" id="statement">Aguarde...</div>

      <div class="buttons">
        <button class="choice" id="btn-certo" onclick="answerQuestion('Certo')">Certo</button>
        <button class="choice" id="btn-errado" onclick="answerQuestion('Errado')">Errado</button>
        <button class="choice" id="btn-branco" onclick="answerQuestion('Em branco')">Em branco</button>
      </div>

      <div class="explanation" id="explanation"></div>

      <button id="nextBtn" onclick="nextQuestion()" style="margin-top:16px;" disabled>Próxima questão</button>
    </div>

    <div class="stats">
      <div class="stat"><small>Certas</small><b id="right">0</b></div>
      <div class="stat"><small>Erradas</small><b id="wrong">0</b></div>
      <div class="stat"><small>Branco</small><b id="blank">0</b></div>
      <div class="stat"><small>Nota</small><b id="score">0</b></div>
    </div>
  </section>

  <section id="screen-erros" class="hidden">
    <div class="card">
      <span class="pill red">Caderno de Erros</span>
      <h2>Questões erradas</h2>
      <div id="errorsList"></div>
    </div>
  </section>

  <section id="screen-mentor" class="hidden">
    <div class="card">
      <span class="pill blue">Mentor PMAL</span>
      <h2>Relatório do desempenho</h2>
      <div id="mentorReport" style="white-space:pre-wrap;line-height:1.55;color:#dbeafe;"></div>
    </div>
  </section>

</div>

<div class="tabs">
  <button class="tab active" onclick="showScreen('simulado')" id="tab-simulado">Simulado</button>
  <button class="tab" onclick="showScreen('erros')" id="tab-erros">Erros</button>
  <button class="tab" onclick="showScreen('mentor')" id="tab-mentor">Mentor</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs, serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCTbgYNBryyLnT6wzBdsi7xGTrLi2d17Dc",
  authDomain: "pmal-elite.firebaseapp.com",
  projectId: "pmal-elite",
  storageBucket: "pmal-elite.firebasestorage.app",
  messagingSenderId: "337195212188",
  appId: "1:337195212188:web:1dec9f3e7c9e9de856bc59"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let userId = null;
let questions = [];
let currentIndex = 0;
let locked = false;

let state = {
  answers: [],
  errors: []
};

window.answerQuestion = answerQuestion;
window.nextQuestion = nextQuestion;
window.showScreen = showScreen;

async function init() {
  document.getElementById("status").textContent = "Autenticando...";
  await signInAnonymously(auth);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      userId = user.uid;
      document.getElementById("status").textContent = "Firebase conectado";
      await loadCloudState();
      await loadQuestions();
    }
  });
}

async function loadQuestions() {
  try {
    const response = await fetch("questions.json");
    questions = await response.json();

    if (!Array.isArray(questions) || questions.length === 0) {
      throw new Error("Banco de questões vazio.");
    }

    renderQuestion();
    updateStats();
    renderErrors();
    renderMentor();
  } catch (error) {
    document.getElementById("statement").textContent = "Erro ao carregar questions.json. Verifique se o arquivo está na raiz do GitHub.";
    document.getElementById("status").textContent = "Erro no banco";
    console.error(error);
  }
}

async function loadCloudState() {
  try {
    const profileRef = doc(db, "users", userId);
    const profileSnap = await getDoc(profileRef);

    if (profileSnap.exists()) {
      const data = profileSnap.data();
      state.answers = data.answers || [];
      state.errors = data.errors || [];
    } else {
      await setDoc(profileRef, {
        createdAt: new Date().toISOString(),
        answers: [],
        errors: []
      });
    }
  } catch (error) {
    console.error("Erro ao carregar nuvem:", error);
    document.getElementById("status").textContent = "Erro Firebase";
  }
}

async function saveCloudState() {
  if (!userId) return;

  try {
    await setDoc(doc(db, "users", userId), {
      updatedAt: new Date().toISOString(),
      answers: state.answers,
      errors: state.errors
    }, { merge: true });
  } catch (error) {
    console.error("Erro ao salvar estado:", error);
  }
}

async function saveAnswerLog(answerRecord) {
  if (!userId) return;

  try {
    await addDoc(collection(db, "users", userId, "answers"), {
      ...answerRecord,
      createdAt: serverTimestamp()
    });
  } catch (error) {
    console.error("Erro ao salvar resposta individual:", error);
  }
}

async function saveErrorLog(errorRecord) {
  if (!userId) return;

  try {
    await addDoc(collection(db, "users", userId, "errors"), {
      ...errorRecord,
      createdAt: serverTimestamp()
    });
  } catch (error) {
    console.error("Erro ao salvar erro individual:", error);
  }
}

function currentQuestion() {
  return questions[currentIndex % questions.length];
}

function renderQuestion() {
  locked = false;
  const q = currentQuestion();

  document.getElementById("counter").textContent = `${currentIndex + 1}/${questions.length}`;
  document.getElementById("topic").textContent = `${q.area} • ${q.topic} • ${q.id}`;
  document.getElementById("statement").textContent = "“" + q.statement + "”";

  document.getElementById("explanation").style.display = "none";
  document.getElementById("explanation").innerHTML = "";

  document.getElementById("nextBtn").disabled = true;

  ["btn-certo", "btn-errado", "btn-branco"].forEach(id => {
    const btn = document.getElementById(id);
    btn.className = "choice";
    btn.disabled = false;
  });
}

async function answerQuestion(choice) {
  if (locked) return;
  locked = true;

  const q = currentQuestion();
  const result = choice === "Em branco" ? "blank" : (choice === q.answer ? "right" : "wrong");

  const answerRecord = {
    questionId: q.id,
    area: q.area,
    topic: q.topic,
    difficulty: q.difficulty,
    userAnswer: choice,
    correctAnswer: q.answer,
    result,
    date: new Date().toISOString()
  };

  state.answers.push(answerRecord);

  if (result === "wrong") {
    const errorRecord = {
      questionId: q.id,
      area: q.area,
      topic: q.topic,
      statement: q.statement,
      userAnswer: choice,
      correctAnswer: q.answer,
      explanation: q.explanation,
      legalBasis: q.legalBasis,
      date: new Date().toISOString(),
      status: "pendente"
    };

    state.errors.push(errorRecord);
    await saveErrorLog(errorRecord);
  }

  await saveAnswerLog(answerRecord);
  await saveCloudState();

  if (q.answer === "Certo") document.getElementById("btn-certo").classList.add("correct");
  if (q.answer === "Errado") document.getElementById("btn-errado").classList.add("correct");

  if (choice === "Certo" && result === "wrong") document.getElementById("btn-certo").classList.add("wrong");
  if (choice === "Errado" && result === "wrong") document.getElementById("btn-errado").classList.add("wrong");
  if (choice === "Em branco") document.getElementById("btn-branco").classList.add("blank");

  document.getElementById("btn-certo").disabled = true;
  document.getElementById("btn-errado").disabled = true;
  document.getElementById("btn-branco").disabled = true;

  const explanation = document.getElementById("explanation");
  explanation.style.display = "block";
  explanation.innerHTML = `
    <strong>Comentário estratégico:</strong><br>
    ${q.explanation || "Sem explicação cadastrada."}
    <div class="law">
      <strong>Fundamento:</strong><br>
      ${q.legalBasis || "Fundamento ainda não cadastrado."}
    </div>
  `;

  document.getElementById("nextBtn").disabled = false;

  updateStats();
  renderErrors();
  renderMentor();
}

function nextQuestion() {
  currentIndex++;

  if (currentIndex >= questions.length) {
    alert("Simulado concluído! Veja seu caderno de erros e o relatório do mentor.");
    currentIndex = 0;
    showScreen("mentor");
  }

  renderQuestion();
}

function updateStats() {
  const right = state.answers.filter(a => a.result === "right").length;
  const wrong = state.answers.filter(a => a.result === "wrong").length;
  const blank = state.answers.filter(a => a.result === "blank").length;
  const score = right - wrong;

  document.getElementById("right").textContent = right;
  document.getElementById("wrong").textContent = wrong;
  document.getElementById("blank").textContent = blank;
  document.getElementById("score").textContent = score;
}

function renderErrors() {
  const box = document.getElementById("errorsList");

  if (!state.errors.length) {
    box.innerHTML = '<div class="error-item">Nenhum erro registrado ainda.</div>';
    return;
  }

  box.innerHTML = state.errors.slice().reverse().map(e => `
    <div class="error-item">
      <strong>${e.area} • ${e.topic}</strong><br><br>
      ${e.statement}<br><br>
      <span class="pill red">Sua resposta: ${e.userAnswer}</span>
      <span class="pill green">Gabarito: ${e.correctAnswer}</span>
      <br><br>
      <strong>Explicação:</strong><br>
      ${e.explanation}
      <div class="law">
        <strong>Fundamento:</strong><br>
        ${e.legalBasis || "Não cadastrado."}
      </div>
    </div>
  `).join("");
}

function renderMentor() {
  const total = state.answers.length;
  const right = state.answers.filter(a => a.result === "right").length;
  const wrong = state.answers.filter(a => a.result === "wrong").length;
  const blank = state.answers.filter(a => a.result === "blank").length;
  const score = right - wrong;
  const precision = total ? Math.round((right / total) * 100) : 0;

  const byArea = {};
  state.answers.forEach(a => {
    if (!byArea[a.area]) byArea[a.area] = { total: 0, wrong: 0 };
    byArea[a.area].total++;
    if (a.result === "wrong") byArea[a.area].wrong++;
  });

  const weak = Object.entries(byArea)
    .map(([area, data]) => ({
      area,
      errorRate: Math.round((data.wrong / data.total) * 100),
      wrong: data.wrong
    }))
    .filter(item => item.wrong > 0)
    .sort((a, b) => b.errorRate - a.errorRate)[0];

  let report = "";

  if (!total) {
    report = "Responda algumas questões para que o mentor identifique seus pontos fortes e fracos.";
  } else {
    report += `Questões respondidas: ${total}\n`;
    report += `Certas: ${right}\n`;
    report += `Erradas: ${wrong}\n`;
    report += `Em branco: ${blank}\n`;
    report += `Nota Cebraspe: ${score}\n`;
    report += `Precisão: ${precision}%\n\n`;

    if (precision < 60) {
      report += "Diagnóstico: base fraca. Priorize teoria e revisão dos erros antes de aumentar o volume.\n\n";
    } else if (precision < 70) {
      report += "Diagnóstico: zona de risco. Você precisa reduzir erros para melhorar a nota líquida.\n\n";
    } else if (precision < 80) {
      report += "Diagnóstico: competitivo, mas ainda instável. Foque nos assuntos com erro recorrente.\n\n";
    } else {
      report += "Diagnóstico: bom desempenho. Agora o foco é consistência e simulados maiores.\n\n";
    }

    if (weak) {
      report += `Ponto fraco principal: ${weak.area}\n`;
      report += `Ação recomendada: revisar essa matéria e fazer um novo bloco focado.\n\n`;
    }

    report += "Missão seguinte: revisar o caderno de erros antes de iniciar novo simulado.";
  }

  document.getElementById("mentorReport").textContent = report;
}

function showScreen(screen) {
  document.getElementById("screen-simulado").classList.toggle("hidden", screen !== "simulado");
  document.getElementById("screen-erros").classList.toggle("hidden", screen !== "erros");
  document.getElementById("screen-mentor").classList.toggle("hidden", screen !== "mentor");

  ["simulado", "erros", "mentor"].forEach(s => {
    document.getElementById("tab-" + s).classList.toggle("active", s === screen);
  });

  if (screen === "erros") renderErrors();
  if (screen === "mentor") renderMentor();
}

init();
</script>
</body>
</html>
