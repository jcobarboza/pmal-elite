<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMAL Elite</title>

<style>
body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:24px;
    padding:30px;
    max-width:700px;
    width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

h1{
    color:#60a5fa;
    margin-top:0;
}

.status{
    background:#111827;
    border:1px solid #334155;
    border-radius:14px;
    padding:16px;
    margin-top:20px;
}

.ok{
    color:#22c55e;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
    <h1>🛡️ PMAL Elite Online</h1>

    <p>Projeto inicial do simulador inteligente PMAL.</p>

    <div class="status">
        <p class="ok">✅ HTML Online Funcionando</p>

        <p>Próximas etapas:</p>

        <ul>
            <li>Firebase Firestore</li>
            <li>Caderno de erros</li>
            <li>Pontuação Cebraspe</li>
            <li>Mentor automático</li>
            <li>Persistência de desempenho</li>
        </ul>
    </div>
</div>

</body>
</html>
